name: CI

# L0 CI 门禁（docs/03 L0、docs/04 F-TEST-002、docs/05 AC-TEST-002 / V0）
# fmt / clippy / test / coverage / 依赖方向 / 追溯完整性 / 可复现基准
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-and-test:
    name: Build, fmt, clippy, test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Configure git default branch
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache cargo registry & build
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

      - name: Dependency direction check
        run: python3 scripts/check_dependency_direction.py

      - name: Traceability check
        run: python3 scripts/check_dependency_direction.py --traceability

      - name: Reproducible bench template self-test
        run: python3 scripts/bench_template.py --self-test

      - name: L3 operator acceptance (differential + boundary + explain analyze)
        run: cargo test -p lattice-executor verify:: -- --nocapture

  coverage:
    name: Coverage (llvm-cov)
    runs-on: ubuntu-24.04
    needs: build-and-test
    steps:
      - name: Configure git default branch
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage summary
        run: cargo llvm-cov --workspace --summary-only
