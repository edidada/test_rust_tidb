# bench/env.toml —— 实验环境固化（docs/05 §9.1 / AC-BENCH-008）
# 与 common::ConfigLoader 的 [server] / [storage] / [optimizer] / [bench] 段兼容。

[server]
listen_addr = "127.0.0.1:4000"
parallelism_default = 1

[storage]
engine = "memory"
data_dir = "data"
block_cache_bytes = 67108864

[optimizer]
chunk_capacity = 1024
broadcast_threshold = 67108864
spill_threshold = 268435456
memory_quota = 536870912
default_selectivity = 0.2
stats_stale_ratio = 0.1
max_rbo_iterations = 100
cbo_timeout_ms = 5000
join_reorder_limit = 12

[optimizer.cost_weights]
cpu = 1.0
io = 10.0
net = 50.0
mem = 2.0

[bench]
seed = 20261109
repeat = 5
